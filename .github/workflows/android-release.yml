name: PauzeControl Android Beta Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    if: contains(github.event.head_commit.message, '[release-v1.6.0-beta]')
    name: Build and publish v1.6.0 Beta 1
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      # This one-time beta tag is already published. Fail closed instead of
      # silently replacing the APK attached to the existing release.
      - name: Refuse to overwrite an existing beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.6.0-beta.1"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; create a new release workflow for a new version."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; refusing to overwrite published assets."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle clean assembleDebug --no-daemon

      - name: Verify APK and prepare release assets
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p dist
          cp "$APK" dist/PauzeControl-v1.6.0-debug.apk
          (cd dist && sha256sum PauzeControl-v1.6.0-debug.apk > SHA256SUMS.txt)

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PauzeControl-v1.6.0-beta.1
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.0-beta.1
          target_commitish: ${{ github.sha }}
          name: PauzeControl v1.6.0 Beta 1 — Device Studio Update
          body_path: docs/RELEASE_NOTES_v1.6.0.md
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: false
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: |
            dist/PauzeControl-v1.6.0-debug.apk
            dist/SHA256SUMS.txt
