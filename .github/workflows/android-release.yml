name: PauzeControl Release Channels

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish beta + stable debug APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle clean assembleDebug --no-daemon

      - name: Verify APK and prepare channel assets
        env:
          APK_VERSION: '1.3.1'
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p dist/beta dist/stable
          cp "$APK" dist/beta/PauzeControl-v1.3.1-beta.1-debug.apk
          cp "$APK" dist/stable/PauzeControl-v1.3.1-debug.apk
          (
            cd dist/beta
            sha256sum PauzeControl-v1.3.1-beta.1-debug.apk > SHA256SUMS.txt
          )
          (
            cd dist/stable
            sha256sum PauzeControl-v1.3.1-debug.apk > SHA256SUMS.txt
          )

      - name: Upload verified APKs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PauzeControl-v1.3.1-beta-and-stable
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta tester release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1-beta.1
          target_commitish: ${{ github.sha }}
          name: PauzeControl v1.3.1 Beta 1
          body: |
            **Beta tester build** for direct Android installation.

            - Includes the current Android UI and the corrected switch direction (ON = thumb right; OFF = thumb left).
            - Debug-signed APK intended for GitHub distribution and testing.
            - Not a Google Play Store release.

            Source commit: ${{ github.sha }}
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: |
            dist/beta/PauzeControl-v1.3.1-beta.1-debug.apk
            dist/beta/SHA256SUMS.txt

      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          target_commitish: ${{ github.sha }}
          name: PauzeControl v1.3.1
          body: |
            **Stable GitHub distribution** for direct Android installation.

            - Contains the same CI-verified source build as Beta 1, after the release pipeline's build and APK verification steps.
            - Debug-signed APK; distribute through GitHub only.
            - Not intended for publication on Google Play.

            Source commit: ${{ github.sha }}
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: |
            dist/stable/PauzeControl-v1.3.1-debug.apk
            dist/stable/SHA256SUMS.txt

      - name: Remove superseded v1.3.0 release entries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          for old_tag in v1.3.0-rc.1 v1.3.0; do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API/releases/tags/$old_tag" || true)"
            release_id="$(printf '%s' "$response" | jq -r '.id // empty')"
            if [[ -n "$release_id" ]]; then
              curl --fail --silent --show-error -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$API/releases/$release_id" >/dev/null
              echo "Deleted superseded GitHub release entry: $old_tag"
            else
              echo "No old release entry found for $old_tag; nothing to delete."
            fi
          done
