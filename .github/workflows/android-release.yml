name: PauzeControl Android Releases

on:
  push:
    tags:
      - 'v1.4.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish v1.4.0 debug and stable GitHub channels
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle clean assembleDebug --no-daemon

      - name: Verify APK and prepare release assets
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p dist/debug dist/stable
          cp "$APK" dist/debug/PauzeControl-v1.4.0-debug.apk
          cp "$APK" dist/stable/PauzeControl-v1.4.0.apk
          (cd dist/debug && sha256sum PauzeControl-v1.4.0-debug.apk > SHA256SUMS.txt)
          (cd dist/stable && sha256sum PauzeControl-v1.4.0.apk > SHA256SUMS.txt)

      - name: Upload verified channel APKs
        uses: actions/upload-artifact@v4
        with:
          name: PauzeControl-v1.4.0-debug-and-stable
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish beta/debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0-beta.1
          target_commitish: ${{ github.sha }}
          name: PauzeControl v1.4.0 Beta 1 — Debug APK
          body_path: docs/RELEASE_NOTES_v1.4.0-debug.md
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: |
            dist/debug/PauzeControl-v1.4.0-debug.apk
            dist/debug/SHA256SUMS.txt

      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          target_commitish: ${{ github.sha }}
          name: PauzeControl v1.4.0 — Stable GitHub Channel
          body_path: docs/RELEASE_NOTES_v1.4.0-stable.md
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: |
            dist/stable/PauzeControl-v1.4.0.apk
            dist/stable/SHA256SUMS.txt
