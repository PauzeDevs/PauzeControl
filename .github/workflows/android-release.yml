name: PauzeControl v1.3.0 Debug APK Release

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and publish debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle clean assembleDebug --no-daemon

      - name: Verify APK archive
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"

      - name: Prepare release APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PauzeControl-v1.3.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PauzeControl-v1.3.0-debug
          path: PauzeControl-v1.3.0-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release with debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: PauzeControl v1.3.0
          body: |
            ## PauzeControl v1.3.0 — Android Debug Release

            This GitHub release distributes the **debug APK** for direct installation and testing. It is not a Google Play Store release.

            ### Included
            - Updated Android control-center UI with Home, Control, Activity, and Settings navigation.
            - Manual video quality options; default 720p at 30 FPS.
            - Android icon and app presentation updates.
            - Security and request-validation fixes documented in `AUDIT_REPORT.md`.
            - Updated README and complete build instructions in `docs/BUILD_NOTES.md`.

            ### Install
            1. Download `PauzeControl-v1.3.0-debug.apk` from Assets below.
            2. On Android, allow installation from this source if prompted.
            3. Install and open the APK.

            ### Important
            - This is a debug build, intended for testing and direct distribution.
            - It is not a Play Store release and is not a signed production build.
            - Keep the Android app paired only with a trusted Mac host and configured private network.

            See `docs/RELEASE_NOTES_v1.3.0.md` and `docs/BUILD_NOTES.md` for details.
          draft: false
          prerelease: false
          files: PauzeControl-v1.3.0-debug.apk
          fail_on_unmatched_files: true
