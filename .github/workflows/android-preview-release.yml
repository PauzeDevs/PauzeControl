name: PauzeControl v1.3.0 Preview Release

on:
  push:
    branches:
      - 'release/v1.3.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    name: Build and publish Android preview APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build preview APK
        working-directory: android
        run: gradle clean assembleDebug --no-daemon

      - name: Verify APK and create checksum
        run: |
          set -euo pipefail
          SOURCE_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SOURCE_APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$SOURCE_APK"
          mkdir -p dist
          cp "$SOURCE_APK" dist/PauzeControl-v1.3.0-rc.1-debug.apk
          cd dist
          sha256sum PauzeControl-v1.3.0-rc.1-debug.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: PauzeControl-v1.3.0-rc.1-preview
          path: |
            dist/PauzeControl-v1.3.0-rc.1-debug.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish visible GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0-rc.1
          target_commitish: ${{ github.sha }}
          name: PauzeControl v1.3.0 RC1 — Android Preview
          prerelease: true
          draft: false
          make_latest: false
          generate_release_notes: false
          overwrite_files: true
          files: |
            dist/PauzeControl-v1.3.0-rc.1-debug.apk
            dist/SHA256SUMS.txt
          body: |
            # PauzeControl v1.3.0 RC1 — Android Preview

            This is a visible release candidate so testers can access the APK from the GitHub Releases page.

            **Important: this artifact is a debug-signed preview APK, not the final stable signed release.** It was built from the v1.3.0 release branch and verified by apksigner. Debug-signing certificates may differ between builds, so this APK may not update an existing install signed with a different key.

            ## Included
            - Redesigned four-tab Android control center and launcher icon.
            - Manual H.264 quality selection without battery-aware override.
            - Connection, streaming, and repository-audit remediation changes in this candidate.
            - SHA-256 checksum file.

            ## Validation
            - Android debug build: run through GitHub Actions.
            - APK signature: verified by apksigner.
            - Device and Mac-to-Android runtime testing is still required before a stable release.

            ## Stable release
            The signed stable release workflow requires the maintained release keystore. The repository Actions signing secrets must be configured before a final stable APK can be built. Do not treat this preview APK as the stable production package.
