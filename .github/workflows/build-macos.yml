name: Build macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Build
        working-directory: mac
        run: swift build -c release

      - name: Package
        working-directory: mac
        run: |
          mkdir -p artifact
          cp .build/release/PauzeControl artifact/PauzeControl
          tar -czf PauzeControl-macos.tar.gz -C artifact PauzeControl

      - uses: actions/upload-artifact@v4
        with:
          name: PauzeControl-macos
          path: mac/PauzeControl-macos.tar.gz
