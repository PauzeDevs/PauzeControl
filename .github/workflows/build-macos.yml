name: Validate macOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Validate Swift package
        working-directory: mac
        run: |
          set -euo pipefail
          swift package dump-package
          find Sources -type f -name '*.swift' -print0 |
            while IFS= read -r -d '' file; do
              swiftc -parse "$file"
            done

      - name: Validate Android tree
        run: test -d android/app/src/main
