name: PauzeControl v1.5.0 Android Design Release

on:
  push:
    branches:
      - 'release/v1.5.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Android-only v1.5.0 APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm Android-only release scope — Mac source update not required
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed_files="$(git diff --name-only origin/main...HEAD)"
          echo "Changed files in this release:"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq '^mac/'; then
            echo "::error title=Unexpected Mac source change::This Android design release must not modify the macOS source."
            exit 1
          fi
          echo "::notice title=Mac source update not required::This is an Android-only PauzeControl design release. The Mac agent source and mac/ directory are unchanged."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android app — Mac source unchanged
        working-directory: android
        run: gradle clean assembleDebug --no-daemon

      - name: Verify APK and prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

          mkdir -p dist/debug dist/stable
          cp "$APK" dist/debug/PauzeControl-v1.5.0-debug.apk
          cp "$APK" dist/stable/PauzeControl-v1.5.0.apk
          (cd dist/debug && sha256sum PauzeControl-v1.5.0-debug.apk > SHA256SUMS.txt)
          (cd dist/stable && sha256sum PauzeControl-v1.5.0.apk > SHA256SUMS.txt)

      - name: Upload APK artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: PauzeControl-v1.5.0-APK
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Publish beta/debug release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0-beta.1
          target_commitish: ${{ github.sha }}
          name: PauzeControl v1.5.0 Beta 1 — Android Design Update
          body_path: docs/RELEASE_NOTES_v1.5.0-debug.md
          prerelease: true
          draft: false
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: |
            dist/debug/PauzeControl-v1.5.0-debug.apk
            dist/debug/SHA256SUMS.txt

      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.0
          target_commitish: ${{ github.sha }}
          name: PauzeControl v1.5.0 — Android Design Update
          body_path: docs/RELEASE_NOTES_v1.5.0-stable.md
          prerelease: false
          draft: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: false
          files: |
            dist/stable/PauzeControl-v1.5.0.apk
            dist/stable/SHA256SUMS.txt
